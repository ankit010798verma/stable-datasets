name: build_sphinx_docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  # A new push to a PR cancels that PR's previous run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The PR check diffs GitHub's merge commit against its first parent (main).
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      # - name: Remove all .rst files except index.rst
      #   run: |
      #     find docs/source -type f -name "*.rst" ! -name "index.rst" -exec rm -f {} \;

      - name: Generate .rst files from package
        run: |
          sphinx-apidoc -o docs/source stable_datasets

      - name: Build Sphinx HTML documentation
        run: |
          cd docs
          sphinx-build -b dirhtml source/ build/ -w ../docs-warnings.txt

      # main still has older warnings, so PRs only fail on warnings from files they changed.
      # Once main builds cleanly, add -W to sphinx-build above and drop this step.
      - name: Fail on docs warnings from files this PR changed
        if: github.event_name == 'pull_request'
        run: python .github/scripts/check_docs_warnings.py docs-warnings.txt --base HEAD^1

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html
          path: docs/build/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/
